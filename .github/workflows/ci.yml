name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build (release)
        run: cargo build --release

      - name: build (release, no default features)
        run: cargo build --release --no-default-features

      - name: test
        run: cargo test --release

  check-linux:
    # Linux 平台跑全量 cargo test --release + cfg-gate 校验（TD-13）。
    # v0.7 之前只跑 6 个手挑的 --test xxx，cfg(target_os="linux") 写错会静默 skip。
    # 现在跑全量 + 校验测试 bin 数 ≥ 30，让 stub 测试（test_linux_stubs.rs）
    # 和 inspect::* 的 Linux 路径真正在 CI 上执行。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: check (default features)
        run: cargo check --all-targets

      - name: check (no default features)
        run: cargo check --no-default-features --all-targets

      - name: test (full suite + cfg-gate verification)
        run: |
          set -euo pipefail
          # 跑全量测试：lib unit tests + 所有 integration tests + cfg(target_os=linux) 部分。
          output=$(cargo test --release 2>&1)
          echo "$output"
          # 每个测试 bin 输出一行 "test result:"。v0.7.0 有 ~50 个测试 bin。
          # 要求 ≥ 30 留余地防新增测试 bin 静默消失（cfg-gate 写错会让整文件不编译）。
          count=$(echo "$output" | grep -c "test result:" || true)
          if [ "$count" -lt 30 ]; then
            echo "::error::Only $count test bins ran on Linux (expected ≥30). Possible cfg-gate silent skip."
            exit 1
          fi
          # 任何测试失败也会让 cargo test 非 0 退出，set -e 已捕获。

  check-macos:
    # macOS 仅 cargo check + clippy（与 Linux 同样的 cfg-gated 降级）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: check (no default features)
        run: cargo check --no-default-features --all-targets

  msrv:
    # 验证 rust-version = "1.85" 声明确实可编译。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2

      - name: check (no default features)
        run: cargo check --no-default-features --all-targets

  audit:
    # 安全审计：cargo-audit 扫描 Cargo.lock 已知漏洞。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
