name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # v0.12.2（TD-43）：proc 转为 Windows-only（ADR-0022）后，删 Linux / macOS
          # build target。Linux ebpf kernel / userspace 二进制构建步骤同步删除
          # （src/ebpf/ 整模块在 v0.12.0 stage 2 已移除）。
          - { os: windows-latest,    target: x86_64-pc-windows-msvc,    archive: zip,    archive_cmd: '7z a -tzip' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build (default)
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p proc-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/proc* proc-${{ matrix.target }}/
          # Windows 二进制是 proc.exe，用通配符 proc* 覆盖；清理掉非二进制（如有）
          cp README.md LICENSE CHANGELOG.md proc-${{ matrix.target }}/
          cp -r completions/ proc-${{ matrix.target }}/
          ${{ matrix.archive_cmd }} proc-${{ matrix.target }}.${{ matrix.archive }} proc-${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proc-${{ matrix.target }}
          path: proc-${{ matrix.target }}.${{ matrix.archive }}
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            proc-${{ matrix.target }}.${{ matrix.archive }}
          generate_release_notes: true
          draft: true   # 草稿状态，给用户审核后手动 publish

  # v0.27（ADR-0037 D5）：update-winget job 移除——上游 action
  # russellbanks/release-automation-winget 仓库已删（首次执行 2026-07-04 即 404，
  # 6/6 全红），且 microsoft/winget-pkgs 无 Alfroul.proc manifest（winget 分发从未
  # 存在，删除零用户破坏）。实际分发渠道 = GitHub Releases（本 build job）+
  # cargo-binstall。未来上 winget 走 winget-pkgs 手动 PR 流程，届时立独立 job。
