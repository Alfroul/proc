name: Miri

# 阶段 2 — H4：Miri 并发 UB 检测 CI。
# 仅跑 Linux（Miri 对 Windows 支持差），覆盖 BackgroundScorer 与 SnapshotWorker
# 两个并发单元的 5 + 4 共 9 个并发测试。Miri 不支持 --release，跑 debug 即可。
#
# 阶段 11 P1-C2：阶段 2 接入时用 continue-on-error: true 容错，阶段 1-9 全部
# 通过后已稳定，flag 移除 —— 后续 Miri 报 UB 将阻断 PR，符合 H4 目标。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      # Cargo.lock 里 sysinfo / bollard 等 dev-dependency 偶尔依赖 nightly 特性。
      # 这里只测试 tests/test_scorer_concurrency.rs 和 tests/test_workers.rs 两个
      # 集成测试二进制，避免把整个 workspace 喂给 Miri（编译时间长 + 无关测试多）。
      - name: cargo miri setup
        run: cargo +nightly miri setup

      - name: miri test_scorer_concurrency
        run: cargo +nightly miri test --tests --test test_scorer_concurrency

      - name: miri test_workers
        run: cargo +nightly miri test --tests --test test_workers
