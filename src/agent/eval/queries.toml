# proc agent eval 的 70 query 基准表（ADR-0032 D2，include_str! 编译进 binary）。
# L0 23 + L1 27 逐字迁移自 v0.20 stage 3b QUERY_TABLE（锚测试锁一致，冻结锚不漂）；
# L2 20 迁移自 tests/fixtures/agent/*-l2.jsonl 的 query 原文 + expected tool 链 authoring。
#
# L2 链口径（brainstorm 风险 3 mitigate）：链是「关键路径」非「唯一路径」——判定用
# 保序子序列（允许中间插其他 tool，不要求相邻）；每条 2-3 个 tool；发现链类 query
# 以 proc_help 开头，诊断类以具体 tool 开头；逐条对照 seed fixture 的 tool call 意图，
# 不自创 query 语义里不存在的 tool。

