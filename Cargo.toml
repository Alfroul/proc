[package]
name = "proc"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "交互式 TUI 系统进程管理器，集成进程/网络/USB/Docker/安全评分/录屏"
license = "MIT"
repository = "https://github.com/Alfroul/proc"
keywords = ["tui", "process-manager", "sysinfo", "monitoring", "terminal"]
categories = ["command-line-utilities", "os::windows-apis"]
authors = ["Alfroul"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.34"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2"
comfy-table = "7"
netstat2 = "0.11"
bollard = { version = "0.18", features = ["http"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = "0.3"
arboard = "3"
dns-lookup = "2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"
sha2 = "0.10"
ctrlc = "3"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Dxgi",
    "Win32_System_Performance",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Power",
    "Win32_System_Time",
] }
filelocksmith = "2"

[target.'cfg(windows)'.dependencies.nvml-wrapper]
version = "0.12"
optional = true

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[features]
default = ["nvidia"]
nvidia = ["nvml-wrapper"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
