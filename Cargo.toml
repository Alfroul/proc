[package]
name = "proc"
version = "0.17.0"
edition = "2024"
rust-version = "1.85"
description = "交互式 TUI 系统进程管理器，集成进程/网络/USB/Docker/安全评分/录屏"
license = "MIT"
repository = "https://github.com/Alfroul/proc"
keywords = ["tui", "process-manager", "sysinfo", "monitoring", "terminal"]
categories = ["command-line-utilities", "os::windows-apis"]
authors = ["Alfroul"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/proc-{ target }{ archive-suffix }"
bin-dir = "proc-{ target }/proc{ binary-ext }"
pkg-fmt = "tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.34"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# v0.6.0 阶段 3：日志按天滚动 + non-blocking writer
tracing-appender = "0.2"
colored = "2"
comfy-table = "7"
netstat2 = "0.11"
bollard = { version = "0.18", features = ["http"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "io-std", "io-util"] }
futures-util = "0.3"
arboard = "3"
dns-lookup = "2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# v0.7 阶段 2：MCP server（proc mcp serve）依赖
# - rmcp：MCP 官方 Rust SDK，server + transport-io 启用 stdio。
#   默认 feature 含 `macros` + `server`，自动启用 `dep:schemars`（v1.x）。
#   我们直接复用 `rmcp::schemars::JsonSchema`，不另引直接依赖避免版本分裂。
# - async-trait：rmcp handler trait 异步接口所需
rmcp = { version = "0.11", features = ["server", "transport-io"] }
async-trait = "0.1"
bincode = "1"
# v0.17 stage 3 TD-44：u64 → String 快速格式化（format_bytes / format_speed /
# format_uptime / format_run_time 中 B 档 / 时间档路径替换 std format!，省 1 次
# heap alloc + 1 次 fmt 调度）。f32 {:.1} 路径仍用 std format!（itoa 不处理 f32）。
itoa = "1"
toml = "0.8"
sha2 = "0.10"
ctrlc = "3"
unicode-width = "0.2"
# 阶段 9 E2：exec 进容器（PTY 集成）
# portable-pty 跨平台 PTY 抽象（Windows ConPTY / Linux POSIX PTY）；
# vt100 解析 docker exec 输出字节流，提供 Screen 状态用于 ratatui 渲染。
portable-pty = "0.9"
vt100 = "0.15"
# v0.7 阶段 3：Shell completion + 命令面板 Ctrl+P
# - clap_complete：clap 官方配套，`proc completions --shell <SHELL>` 在线生成
#   bash/zsh/fish/powershell/elvish 5 种 shell 补全脚本。
# - nucleo：Helix 编辑器 fuzzy 匹配库（性能极佳），用于命令面板 Ctrl+P。
# 输入框逻辑简单（String + cursor），手写避免 tui-input 与 ratatui 0.29
# 在 unicode-width (=0.2.0 vs ^0.2.2) 上的版本冲突。
clap_complete = "4"
nucleo = "0.5"
# v0.7 阶段 4：过滤表达式 FilterExpr（ADR-0011）。
# - nom：轻量 parser combinator，递归下降解析 `cpu > 5 AND name =~ /chrome/i`。
# - regex：FilterExpr 的 `=~` 操作符 + 单位后缀校验。底部/btop 同款思路。
nom = "7"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Dxgi",
    "Win32_System_Performance",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Power",
    "Win32_System_Time",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Wdk_System_Threading",
    "Win32_System_Diagnostics_Etw",
] }
filelocksmith = "2"

[target.'cfg(windows)'.dependencies.nvml-wrapper]
version = "0.12"
optional = true

[features]
default = ["nvidia", "mcp-persistent-state"]
nvidia = ["nvml-wrapper"]
# v0.17 stage 1（ADR-0026）：ProcMcpHandler 持久字段 cfg-gate。
# 默认开启让生产路径有 snapshot / system_history / record_handle 字段；
# --no-default-features 时 cfg-gate 掉，struct 不含这 3 个字段（最小化 build）。
mcp-persistent-state = []

# v0.12.0 阶段 1（ADR-0022）：proc 转为 Windows-only。
# v0.12.0 阶段 2：移除 nvtop / nethogs / ebpf 空 feature stub
# （对应模块 NvtopProvider / NethogsCollector / src/ebpf/ 已在 stage 2 删除）。

[dev-dependencies]
tempfile = "3"
# v0.6.0 阶段 3：log_rotate 测试需要设置文件 mtime 模拟「8 天前的日志」。
filetime = "0.2"
# v0.13 阶段 1：criterion benchmark suite（ADR: 性能 baseline cycle 方案 A）。
# 锁 0.5（最新稳定）。与 Rust MSRV 1.85 兼容（criterion 0.5 要求 Rust 1.70+）。
# 不在 CI 跑（决策表 B），仅本地手跑——GitHub Actions 共享 runner 抖动大。
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# v0.13 阶段 1：bench profile 与 release 对齐（lto=thin + codegen-units=1），
# 避免 benchmark 数字与 release 行为不一致。opt-level 默认 3 就够。
[profile.bench]
lto = "thin"
codegen-units = 1

# v0.13 阶段 1：6 个 hot path 的 criterion benchmark。
# harness = false 是 criterion 标准要求——让 criterion_main! 接管 main 函数。
# bench 文件路径 benches/{name}.rs，共享 fixture 在 benches/common/mod.rs。
[[bench]]
name = "bench_rebuild_sorted_cache"
harness = false

[[bench]]
name = "bench_refresh_heavy"
harness = false

[[bench]]
name = "bench_tui_draw"
harness = false

[[bench]]
name = "bench_record_serialize"
harness = false

[[bench]]
name = "bench_filter_expr_apply"
harness = false

[[bench]]
name = "bench_search_hot_path"
harness = false
